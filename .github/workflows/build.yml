name: Build StatusBarCleaner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'app/src/main/**'
      - 'app/build.gradle.kts'
      - 'app/proguard-rules.pro'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'gradle.properties'

jobs:
  build:
    runs-on: macos-latest
    name: 构建 Debug APK
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-overwrite-existing: true

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug

      - name: 重命名 APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          mv "$APK_PATH" "app/build/outputs/apk/debug/StatusBarCleaner.apk"
          ls -lh "app/build/outputs/apk/debug/StatusBarCleaner.apk"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: StatusBarCleaner
          path: app/build/outputs/apk/debug/StatusBarCleaner.apk
          if-no-files-found: error
          compression-level: 9